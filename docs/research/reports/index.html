<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sputnik reports</title>
<style>
:root {
  --text:#1f2937; --text-strong:#0f172a; --text-muted:#64748b;
  --bg:#fafaf9; --card:#ffffff; --border:#e5e7eb; --border-soft:#f1f5f9;
  --code-bg:#f1f5f9; --link:#1d4ed8;
  --open:#15803d; --open-bg:#f0fdf4; --open-border:#bbf7d0;
  --closed:#475569; --closed-bg:#f1f5f9; --closed-border:#cbd5e1;
  /* sequence-диаграммы (lib/diagram.js): цвета вынесены сюда, чтобы правка палитры
     репорта меняла и картинки — SVG инлайновый и видит эти переменные */
  --dg-line:#94a3b8; --dg-text:#1f2937; --dg-muted:#64748b;
  --dg-box:#ffffff; --dg-box-border:#cbd5e1; --dg-head:#f1f5f9;
  --dg-note:#fffbeb; --dg-note-border:#fcd34d;
  --dg-frame:#cbd5e1; --dg-frame-label:#eef2ff;
}
html { -webkit-text-size-adjust:100%; color-scheme:light only; }
* { box-sizing:border-box; }
body { font-family:system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif; font-size:18px; line-height:1.6;
       color:var(--text); background:var(--bg); text-rendering:optimizeLegibility; font-feature-settings:"kern";
       margin:0; padding:0 0 80px; }
.wrap { max-width:980px; margin:0 auto; padding:0 32px; }
h1 { font-size:34px; line-height:1.25; margin:0 0 8px; font-weight:700; letter-spacing:-0.5px; color:var(--text-strong); }
h2 { font-size:26px; line-height:1.3; margin:48px 0 18px; padding-bottom:10px; border-bottom:1px solid var(--border); font-weight:700; letter-spacing:-0.2px; color:var(--text-strong); }
h3 { font-size:20px; line-height:1.4; margin:20px 0 10px; font-weight:700; color:var(--text-strong); }
p { margin:10px 0; }
ul, ol { padding-left:26px; margin:10px 0; }
li > ul, li > ol { margin:4px 0 2px; }
li { margin:6px 0; }
/* Чеклисты `- [ ]` / `- [x]`: квадрат рисуется рамкой, чтобы не зависеть от шрифта */
li.task { list-style:none; position:relative; margin-left:-24px; padding-left:24px; }
li.task .box { position:absolute; left:0; top:5px; width:14px; height:14px; box-sizing:border-box;
               border:1.5px solid var(--closed-border); border-radius:3px; background:var(--card); }
li.task .box.on { border-color:var(--open); background:var(--open); }
li.task .box.on::after { content:""; position:absolute; left:3px; top:1px; width:4px; height:8px;
                         box-sizing:border-box; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(40deg); }
b, strong { font-weight:600; color:var(--text-strong); }
code, pre { font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace; }
code { font-size:0.875em; background:var(--code-bg); padding:1px 6px; border-radius:4px; color:var(--text-strong);
       overflow-wrap:anywhere; }
pre { background:#f8fafc; border:1px solid var(--border); border-radius:6px; padding:14px 16px; font-size:15px; line-height:1.55; overflow-x:auto; margin:12px 0; }
pre code { background:none; padding:0; font-size:inherit; overflow-wrap:normal; }
a { color:var(--link); text-decoration:none; }
a:hover { text-decoration:underline; }
.meta { color:var(--text-muted); font-size:16px; margin:6px 0 12px; }
.mut { color:var(--text-muted); font-size:15px; }
table { border-collapse:collapse; width:100%; margin:16px 0; font-size:16px; background:var(--card); border-radius:6px; overflow:hidden; border:1px solid var(--border); }
th, td { border-bottom:1px solid var(--border-soft); padding:10px 14px; vertical-align:top; text-align:left; }
tr:last-child th, tr:last-child td { border-bottom:none; }
th { background:#f8fafc; font-weight:600; color:var(--text-strong); border-bottom-color:var(--border); cursor:pointer; user-select:none; white-space:nowrap; }
th .dir { color:var(--link); }
tbody tr:hover { background:#fafbfc; }
tr.row:hover { background:#f0f6ff; cursor:pointer; }
td.title { max-width:420px; } td.title b { font-weight:600; color:var(--text-strong); }
.pill { display:inline-block; padding:2px 9px; border-radius:4px; font-size:14px; font-weight:700; letter-spacing:0.4px;
        margin-right:8px; vertical-align:1px; line-height:1.4; border:1px solid; white-space:nowrap; }
.p-open { background:var(--open-bg); color:var(--open); border-color:var(--open-border); }
.p-closed { background:var(--closed-bg); color:var(--closed); border-color:var(--closed-border); }
.chip { display:inline-block; background:var(--code-bg); color:#334155; border-radius:4px; padding:1px 8px; font-size:14px;
        margin:2px 4px 0 0; font-family:ui-monospace,"SF Mono",Menlo,monospace; border:1px solid var(--border); }
header { padding:34px 0 0; }
header .sub { color:var(--text-muted); font-size:16px; }
#toolbar { background:var(--bg); border-bottom:1px solid var(--border); padding:12px 0; position:sticky; top:0; z-index:2; }
#toolbar .wrap { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
input[type=search] { flex:1 1 240px; padding:7px 12px; border:1px solid var(--border); border-radius:6px; font-size:16.5px; background:var(--card); }
select { padding:7px 8px; border:1px solid var(--border); border-radius:6px; background:var(--card); font-size:15.5px; max-width:170px; color:var(--text); }
main { margin-top:10px; }
#count { color:var(--text-muted); margin:14px 0 0; font-size:16px; }
#doc { display:none; }
#doc.show { display:block; }
#list.hide { display:none; }
#back { display:none; color:var(--link); cursor:pointer; background:var(--card); border:1px solid var(--border);
        border-radius:6px; font-size:16px; padding:6px 14px; }
#back:hover { background:#f0f6ff; }
body.doc-mode #back { display:inline-block; }
body.doc-mode #toolbar input, body.doc-mode #toolbar select { display:none; }
body.doc-mode header { display:none; }
#doc-head h1 { margin-top:24px; }
#doc-body blockquote { border-left:3px solid var(--border); margin:10px 0; padding:4px 14px; color:var(--text-muted); }
#doc-body hr { border:none; border-top:1px solid var(--border); margin:24px 0; }
#doc-body img { display:block; max-width:100%; height:auto; margin:14px 0 2px; border:1px solid var(--border); border-radius:8px; }
#doc-body .cap { display:block; font-size:15px; color:var(--text-muted); margin:0 0 14px; }
/* Таблицы в теле документа: колонки переносят текст, а не раздувают страницу.
   nowrap на th нужен только сортируемым заголовкам списка, здесь он лишний. */
#doc-body th { white-space:normal; cursor:auto; }
#doc-body th, #doc-body td { overflow-wrap:break-word; }
/* То же для текста: голый URL (youtube, obsidian://) переносу не поддаётся,
   распирает строку и тянет горизонтальный скролл всей страницы. */
#doc-body p, #doc-body li, #doc-body a { overflow-wrap:break-word; }
/* Широкую таблицу скроллим внутри её обёртки, а не всем документом */
#doc-body .table-scroll { overflow-x:auto; margin:16px 0; }
#doc-body .table-scroll > table { margin:0; }
/* Код в ячейке целиком на одной строке: `variant-b` рвался на дефисе. Колонку под самый длинный код
   рендер считает сам, тесная таблица скроллится, а не переносит код. */
#doc-body td code, #doc-body th code { white-space:nowrap; overflow-wrap:normal; }
/* Служебные колонки берут ровно свою ширину: идентификатор, приоритет, короткий
   статус. Без этого раскладка делила место «по-честному», короткий код рвался
   по буквам (SCH-110 в четыре строки), а текстовые колонки сжимались в полоски.
   Отметку ставит рендер: колонка, где ни одна ячейка не длиннее 14 знаков. */
#doc-body th.tight, #doc-body td.tight { white-space:nowrap; width:1%; overflow-wrap:normal; }
#doc-body th.tight code, #doc-body td.tight code { overflow-wrap:normal; }
/* Когда колонок три и больше, тесноту лечим прокруткой внутри обёртки, а не
   сминанием: ниже этой ширины таблица едет вбок, страница остаётся на месте */
#doc-body .table-scroll.wide > table { min-width:600px; }
.tldr { background:#f8fafc; border:1px solid var(--border); border-radius:10px; padding:18px 24px; margin:20px 0 28px; }
.tldr h2 { font-size:16px; margin:0 0 10px; border:none; padding:0; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; font-weight:700; }
.tldr table { margin:0; }
.tldr td { padding:6px 12px; font-size:15.5px; }
.tldr td:first-child { color:var(--text-muted); white-space:nowrap; width:1%; }
/* пункты преамбулы, которые не являются парами «ключ: значение» */
.tldr .fields-note { margin:10px 0 0; padding-left:20px; font-size:15.5px; color:var(--text-muted); }
.tldr .fields-note li { margin:4px 0; }
.card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:18px 24px; margin:18px 0; line-height:1.65; }
.card h3 { margin:0 0 10px; font-size:18px; display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 8px; }
.card > p:last-child, .card > *:last-child { margin-bottom:0; }
.card .meta { margin:0 0 8px; }
.card.ctx { border-left:4px solid #7c3aed; }
.comment { margin:28px 0; }
.comment .c-name { font-size:16px; font-weight:600; color:var(--text-strong); }
.comment .c-date { font-size:15px; color:var(--text-muted); margin-left:8px; }
.comment .c-body { margin-top:4px; }
.comment .c-body p { margin:6px 0; }
.clamp.collapsed { max-height:350px; overflow:hidden; position:relative; }
.clamp.collapsed::after { content:""; position:absolute; left:0; right:0; bottom:0; height:70px;
  background:linear-gradient(rgba(250,250,249,0), var(--bg)); pointer-events:none; }
.card .clamp.collapsed::after { background:linear-gradient(rgba(255,255,255,0), var(--card)); }
.clamp-toggle { display:block; width:100%; text-align:left; margin:6px 0 28px; color:var(--link); cursor:pointer;
  background:none; border:none; font-size:16px; padding:14px 12px; min-height:44px; border-radius:6px; font-family:inherit; }
.clamp-toggle:hover { background:#eff3ff; text-decoration:underline; }
.card.warn { background:#fffbeb; border-color:#fde68a; }
.card.done { border-left:4px solid #16a34a; }
@media (max-width:800px){ .opt { display:none; } td.title { max-width:none; } }

/* --- Страница репорта: секции-карточки и сайдбар-оглавление --- */
html { scroll-behavior:smooth; }
.sec { background:var(--card); border:1px solid var(--border); border-radius:12px;
       padding:6px 28px 22px; margin:22px 0; scroll-margin-top:24px;
       box-shadow:0 1px 2px rgba(15,23,42,0.04); }
.sec h2 { margin-top:22px; }
.sec > :last-child { margin-bottom:0; }
/* секции-обёртки вокруг готовых карточек (⚠, Outline): без собственной рамки */
.sec.bare { background:none; border:none; padding:0; box-shadow:none; margin:0; }
.sec h3 { scroll-margin-top:24px; }
/* 1552 = 64 (паддинги .wrap) + 248 (оглавление) + 44 (отбивка) + 904 (текст) + 292 (поле справа) */
.layout { --toc-w:clamp(150px, 22%, 248px); --toc-gap:clamp(20px, 3vw, 44px);
          display:flex; align-items:flex-start; max-width:1552px; }
.layout #doc-body { flex:1; min-width:0; }
/* Оглавление слева от текста. Ширина колонки — процент от раскладки с полом и
   потолком: сайдбар сжимается вместе с окном, а не роняет раскладку в столбик,
   пока место есть. align-self:stretch обязателен: с align-items:flex-start
   колонка сжимается до высоты содержимого и sticky-блоку некуда «ехать» */
#toc { width:var(--toc-w); margin-right:var(--toc-gap); flex:none; align-self:stretch; }
/* Пустое поле справа ровно в ширину оглавления с отбивкой: колонка текста
   встаёт по центру страницы, а не сдвинутой вправо на ширину сайдбара.
   Note: поле растёт от нуля начиная с 1000px и добирает полную ширину к ~1250px —
   иначе на средних окнах симметрия отгрызала бы у текста те же 290px, которых
   ему там и так не хватает. Центрирование точное, пока min() держит первую ветку. */
.layout::after { content:''; flex:none;
                 width:min(calc(var(--toc-w) + var(--toc-gap)), max(0px, (100vw - 1000px) * 1.2)); }
#toc .toc-inner { position:sticky; top:24px; max-height:calc(100vh - 48px); overflow-y:auto;
                  padding:18px 0; margin-top:96px; }
#toc .toc-title { font-size:14px; font-weight:700; text-transform:uppercase; letter-spacing:1px;
                  color:var(--text-muted); margin-bottom:10px; }
#toc ul { list-style:none; margin:0; padding:0; }
#toc li { margin:0; }
#toc li a { display:block; padding:5px 0; font-size:15.5px; line-height:1.45; color:var(--text); }
#toc li.sub a { padding-left:14px; font-size:14.5px; color:var(--text-muted); }
#toc li a:hover { color:var(--link); text-decoration:none; }
/* Средние окна: отступ сверху не нужен — на узкой колонке оглавление и так
   начинается ниже шапки, а лишние 96px просто съедают видимую часть списка */
@media (max-width:1000px){
  #toc .toc-inner { margin-top:64px; }
}
/* В столбик — только на телефонных ширинах, где колонка текста ушла бы ниже ~380px.
   Сложенное оглавление ограничено по высоте и скроллится: иначе длинный список
   встаёт стеной над документом и до заголовка приходится листать. */
@media (max-width:620px){
  .wrap { padding:0 16px; }
  .layout { display:block; }
  .layout::after { display:none; }
  #toc { width:auto; margin-right:0; }
  #toc .toc-inner { position:static; margin:20px 0 0; padding:0 0 12px; max-height:210px; overflow-y:auto;
                    border-bottom:1px solid var(--border); }
}

/* Кнопка «Поделиться» в шапке репорта и её попап. Единственное интерактивное
   место в странице; Finder-ссылка ведёт на схему sp-reveal:// (см. render.js). */
[hidden] { display:none !important; }
.head-row { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; }
.head-row h1 { flex:1 1 auto; min-width:0; }
.share { position:relative; flex:0 0 auto; margin-top:30px; }
.share-btn { display:inline-flex; align-items:center; gap:7px; padding:7px 11px; font:inherit; font-size:15px;
             color:var(--text-muted); background:transparent; border:0; border-radius:7px;
             cursor:pointer; white-space:nowrap; }
.share-btn:hover,
.share-btn[aria-expanded="true"] { background:var(--border-soft); color:var(--text-strong); }
.share-btn svg { flex:0 0 auto; opacity:0.75; }
.share-pop { position:absolute; right:0; top:calc(100% + 8px); z-index:5; width:320px; max-width:calc(100vw - 64px);
             background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px;
             box-shadow:0 10px 28px rgba(15,23,42,0.13); }
.share-file { font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:13px; color:var(--text-strong);
              overflow-wrap:anywhere; line-height:1.45; }
.share-dir { font-size:13px; color:var(--text-muted); margin:2px 0 12px; overflow-wrap:anywhere; }
.share-act { display:flex; align-items:center; gap:8px; padding:10px 12px; font-size:15px; border-radius:7px;
             color:var(--text-strong); background:var(--border-soft); border:0; }
.share-act:hover { background:var(--code-bg); text-decoration:none; }
.share-note { font-size:13.5px; color:var(--text-muted); margin:0; }
@media (max-width:600px) {
  .head-row { flex-direction:column; gap:0; }
  .share { margin:4px 0 8px; }
  .share-pop { right:auto; left:0; }
}

/* Диаграммы. История трёх заходов, чтобы не наступить снова:
   1) max-width:100% в узкой колонке (её сужает сайдбар оглавления) сжимал
      диаграмму 900+ px почти вдвое — подписи становились нечитаемыми;
   2) natural size без сжатия давал горизонтальный скролл — читается так же плохо;
   3) статичную картинку нельзя ни подвинуть, ни приблизить.
   Итог: фигура уезжает вправо в свободное поле страницы, диаграмма вписывается
   целиком, а деталь смотрится зумом (lib/diagram.js подмешивает svg-pan-zoom). */
.diagram { margin:18px 0; padding:0; position:relative; }
/* Диаграмма живёт строго в колонке текста: bleed вправо пробовали — он выносил
   картинку за границы страницы, и это читалось как поломка. Мелкий текст лечится
   не растягиванием, а зумом (lib/diagram.js: svg-pan-zoom, кнопки, полный экран). */
.dg-scroll { background:var(--card); border:1px solid var(--border-soft); border-radius:8px;
             padding:12px 10px; overflow:hidden; }
.dg { display:block; }
.diagram figcaption { font-size:14px; color:var(--text-muted); margin-top:6px; }

/* Панель управления показывается только когда pan/zoom реально включился:
   без JS (печать, Quick Look) кнопки бесполезны и их не видно */
.dg-tools { display:none; gap:6px; justify-content:flex-end; margin-bottom:6px; }
.dg-live .dg-tools { display:flex; }
.dg-btn { font:inherit; font-size:13.5px; line-height:1; padding:6px 10px; cursor:pointer;
          color:var(--text-muted); background:var(--card); border:1px solid var(--border);
          border-radius:6px; }
.dg-btn:hover { color:var(--text-strong); background:var(--code-bg); }
.dg-live .dg-scroll { cursor:grab; }
.dg-live .dg-scroll:active { cursor:grabbing; }
/* во весь экран: фон и центрирование, иначе картинка прилипает к левому верху */
.dg-scroll:fullscreen { display:flex; align-items:center; justify-content:center;
                        background:var(--bg); border:none; border-radius:0; padding:24px; }
.dg-scroll:fullscreen .dg { max-height:none; height:100%; width:100%; }

/* --- Кирпичи блоков-директив (::: nav / tags / kv / cards) --- */

/* Лента навигации: ряд карточек-ссылок на соседние страницы серии или на
   разделы этой же. Колонки набираются по ширине, поэтому семь пунктов на
   широком окне встают в ряд, а на телефоне — в два столбца, без медиазапроса. */
.strip { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:8px; margin:16px 0; }
.strip > a, .strip > .here { display:block; padding:10px 12px; border-radius:8px; border:1px solid var(--border);
                             background:var(--card); color:var(--text); font-size:15px; line-height:1.35; }
.strip > a:hover { border-color:var(--link); text-decoration:none; }
/* Текущая страница: плашка вместо ссылки — ходить по ней некуда */
.strip > .here { background:var(--code-bg); border-color:transparent; }
.strip .n { display:block; font-size:11.5px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase;
            color:var(--text-muted); margin-bottom:3px; }
.strip .t { display:block; color:var(--text-strong); }
.strip .c { display:block; font-size:13.5px; color:var(--text-muted); margin-top:3px;
            font-variant-numeric:tabular-nums; }
.strip > .here .n { color:var(--link); }

/* Бейджи-пилюли: оси предусловия строкой вместо таблицы на две колонки */
.tagrow { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 16px; }
.tag { display:inline-block; font-size:11.5px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase;
       padding:3px 9px; border-radius:999px; white-space:nowrap;
       background:var(--code-bg); color:#334155; border:1px solid var(--border); }
.tag.crit { background:#fde7e7; color:#a01212; border-color:#f6c9c9; }
.tag.done { background:var(--open-bg); color:var(--open); border-color:var(--open-border); }
.tag.mut { background:none; color:var(--text-muted); }

/* Пары «подпись — значение»: узкая колонка подписей слева, значения справа */
.kv { display:grid; grid-template-columns:minmax(110px, 150px) 1fr; gap:6px 18px; margin:14px 0; font-size:16px; }
.kv dt { color:var(--text-muted); }
.kv dd { margin:0; color:var(--text); }

/* Плитка карточек: короткие списки рядом, а не простынёй друг под другом */
.grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; margin:16px 0; }
.gcard { background:#f8fafc; border:1px solid var(--border-soft); border-radius:8px; padding:14px 16px; }
.gcard .k { font-size:11.5px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase;
            color:var(--text-muted); margin-bottom:8px; }
.gcard > :last-child { margin-bottom:0; }
.gcard ul { padding-left:18px; margin:6px 0; font-size:15.5px; }
.gcard li { margin:4px 0; }
.gcard p { font-size:15.5px; margin:6px 0; }

@media (max-width:620px) {
  .kv { grid-template-columns:1fr; gap:0 0; }
  .kv dt { margin-top:10px; font-size:14px; }
}

/* Документ с широкими таблицами: поле справа отдаётся содержимому. Пустая
   полоса в 292px нужна была для оптического центрирования колонки текста, но
   рядом с таблицей на четыре колонки она просто отнимает место. Абзацы, списки
   и цитаты при этом держат свой потолок ширины, иначе строка уезжает на 1200px
   и её неудобно читать. */
.layout.wide-doc::after { width:0; }
.wide-doc #doc-body p,
.wide-doc #doc-body ul,
.wide-doc #doc-body ol,
.wide-doc #doc-body blockquote,
.wide-doc #doc-body .kv { max-width:84ch; }

/* --- Тест-кейсы блоками (::: cases) --- */
/* Таблицей они не живут: две текстовые колонки делят остаток ширины и сминаются
   в полоски, а короткий идентификатор ещё и рвётся по буквам. Блок отдаёт тексту
   всю ширину колонки и не зависит от числа колонок.

   Подписи «делаем» и «ожидаем» стоят своей колонкой, а не в начале строки:
   когда подпись висела инлайном, текст обтекал её и вторая строка уезжала под
   подпись — глазу не за что зацепиться. Ожидаемый результат набран тем же
   контрастом, что и действие: это то, с чем сверяются, а не сноска. */
.cases { list-style:none; margin:14px 0 4px; padding:0; }
.case { display:grid; grid-template-columns:86px 74px minmax(0, 1fr);
        column-gap:16px; row-gap:14px; padding:19px 0;
        border-top:1px solid var(--border-soft); scroll-margin-top:24px; }
.case:first-child { border-top:none; padding-top:4px; }
/* Рейка с идентификатором занимает обе строки справа от себя */
.cid { grid-row:1 / span 2; display:flex; flex-direction:column; align-items:flex-start; gap:6px; }
.cno { font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace; font-size:13.5px;
       color:var(--text-muted); white-space:nowrap; }
.prio { font-size:11px; font-weight:700; letter-spacing:0.05em; padding:2px 7px; border-radius:999px;
        border:1px solid; line-height:1.4; }
.prio.p0 { background:#fde7e7; color:#a01212; border-color:#f6c9c9; }
.prio.p1 { background:var(--code-bg); color:#334155; border-color:var(--border); }
.prio.p2 { background:none; color:var(--text-muted); border-color:var(--border-soft); }
.clab { font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase;
        color:var(--text-muted); line-height:1.6; padding-top:3px; white-space:nowrap; }
.cwhat { color:var(--text-strong); }
/* Ожидаемый результат — главное в кейсе. Отделён линейкой слева, а не серым */
.cexp { color:var(--text-strong); border-left:2px solid var(--border); padding-left:14px;
        margin-left:-16px; }
.case:target { background:#fffbeb; box-shadow:0 0 0 10px #fffbeb; border-radius:2px; }
/* Узкие окна: рейка ложится строкой, подписи встают над своим текстом */
@media (max-width:760px) {
  .case { grid-template-columns:1fr; row-gap:10px; }
  .cid { grid-row:auto; flex-direction:row; align-items:center; gap:8px; margin-bottom:3px; }
  .clab { padding-top:0; margin-bottom:-6px; }
  .cexp { margin-left:0; }
}
</style></head><body>
<header><div class="wrap">
  <h1 style="font-size:28px">Sputnik reports</h1>
  <div class="sub">Репорты · <code>~/SeasonArt/docs/research/reports</code> · генерятся скриптом <code>report</code> · обновлено 2026-11-06</div>
</div></header>
<div id="toolbar"><div class="wrap">
  <input id="q" type="search" placeholder="Поиск по заголовкам, полям, веткам, MR…">
  <select id="f-project"></select><select id="f-repository"></select>
  <select id="f-status"></select><select id="f-assignee"></select>
  <select id="f-work_type"></select><select id="f-sprint"></select>
  <select id="f-branch"></select>
</div></div>
<main class="wrap">
  <div id="list"><div id="count"></div><table>
    <thead><tr>
      <th data-k="title">Задача</th><th data-k="project">Проект / секция</th>
      <th data-k="repository" class="opt">Репозиторий</th><th data-k="status">Статус</th>
      <th data-k="assignee" class="opt">Исполнитель</th><th data-k="work_type" class="opt">Тип</th>
      <th data-k="sprint" class="opt">Спринт</th><th data-k="generated">Обновлён</th>
    </tr></thead><tbody id="rows"></tbody>
  </table></div>
</main>
<script>
const DATA = [{"file":"2026-11-06-koiart-analysis.md","html":"2026-11-06-koiart-analysis.html","title":"KoiArt: устройство, визуальный разбор и стоимость аналога","project":"KoiArt","section":null,"status":null,"assignee":"Pyanov Nikita","repository":null,"work_type":"разбор","sprint":null,"quota":null,"branches":[],"mrs":[],"url":"https://koiart.app/","theme":"doc","generated":"2026-11-06T09:05:59.293Z"},{"file":"2026-11-06-koiart-open-source-context.md","html":"2026-11-06-koiart-open-source-context.html","title":"KoiArt: открытые реализации и наша база macOS","project":"KoiArt","section":null,"status":null,"assignee":"Pyanov Nikita","repository":null,"work_type":"исследование","sprint":null,"quota":null,"branches":[],"mrs":[],"url":"https://koiart.app/","theme":"doc","generated":"2026-11-06T09:05:58.120Z"}];
const FILTERS = { project:'Проект', repository:'Репозиторий', status:'Статус', assignee:'Исполнитель', work_type:'Тип', sprint:'Спринт', branch:'Ветка' };
let sortK = 'generated', sortDir = -1;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

for (const [key, label] of Object.entries(FILTERS)) {
  const values = [...new Set(DATA.flatMap((r) => key === 'branch' ? r.branches : [r[key]]).filter(Boolean))].sort();
  $('#f-' + key).innerHTML = '<option value="">' + label + ': все</option>' +
    values.map((v) => '<option>' + esc(v) + '</option>').join('');
}

function current() {
  const q = $('#q').value.toLowerCase().split(/\s+/).filter(Boolean);
  let rows = DATA.filter((r) => {
    for (const key of Object.keys(FILTERS)) {
      const v = $('#f-' + key).value;
      if (!v) continue;
      if (key === 'branch' ? !r.branches.includes(v) : r[key] !== v) return false;
    }
    if (!q.length) return true;
    // тел репортов здесь нет – ищем по заголовку и полям
    const hay = [r.title, r.project, r.section, r.status, r.assignee, r.repository,
      r.work_type, r.sprint, r.file, ...r.branches, ...r.mrs].filter(Boolean).join(' ').toLowerCase();
    return q.every((w) => hay.includes(w));
  });
  rows.sort((a, b) => String(a[sortK] ?? '').localeCompare(String(b[sortK] ?? ''), 'ru') * sortDir);
  return rows;
}

function renderList() {
  const rows = current();
  $('#count').textContent = rows.length + ' из ' + DATA.length;
  $('#rows').innerHTML = rows.map((r) =>
    '<tr class="row" data-href="' + encodeURI(r.html) + '">' +
      '<td class="title"><a href="' + encodeURI(r.html) + '"><b>' + esc(r.title) + '</b></a>' +
        (r.branches.length ? '<br>' + r.branches.map((b) => '<span class="chip">' + esc(b) + '</span>').join('') : '') + '</td>' +
      '<td>' + esc(r.project ?? '—') + (r.section ? '<div class="mut">' + esc(r.section) + '</div>' : '') + '</td>' +
      '<td class="opt">' + esc(r.repository ?? '—') + '</td>' +
      '<td>' + (r.status ? '<span class="pill ' + (r.status === 'открыта' ? 'p-open' : 'p-closed') + '">' + esc(r.status) + '</span>' : '—') + '</td>' +
      '<td class="opt">' + esc(r.assignee ?? '—') + '</td>' +
      '<td class="opt">' + esc(r.work_type ?? '—') + '</td>' +
      '<td class="opt">' + esc(r.sprint ?? '—') + '</td>' +
      '<td class="mut">' + r.generated.slice(0, 10) + '</td></tr>').join('');
  document.querySelectorAll('th').forEach((th) => {
    th.querySelector('.dir')?.remove();
    if (th.dataset.k === sortK) th.insertAdjacentHTML('beforeend', ' <span class="dir">' + (sortDir > 0 ? '↑' : '↓') + '</span>');
  });
}

// клик по строке открывает страницу репорта, но не мешает клику по самой ссылке
$('#rows').onclick = (e) => {
  if (e.target.closest('a')) return;
  const tr = e.target.closest('tr.row');
  if (tr) location.href = tr.dataset.href;
};
document.querySelectorAll('th').forEach((th) => th.onclick = () => {
  const k = th.dataset.k;
  sortDir = (k === sortK) ? -sortDir : (k === 'generated' ? -1 : 1);
  sortK = k; renderList();
});
$('#q').oninput = renderList;
for (const key of Object.keys(FILTERS)) $('#f-' + key).onchange = renderList;
renderList();
</script></body></html>
